; Limites de PHP sur l'hébergement mutualisé (production OVH, 2026-10-14).
;
; PHP-FPM y lit ce fichier (vérifié sur l'hébergement) ; le conteneur de la
; preprod, lui, l'ignore et applique docker/php/php.ini. Les deux portent les
; mêmes valeurs (UploadValidatorTest).
;
; Par défaut, OVH accorde 512 Mo de mémoire et 128 Mo d'envoi : une image HD de
; 150 Mo y serait refusée par PHP, une de 60 Mpx y mourrait au décodage. La
; durée d'exécution, elle, est fixée par l'hébergeur (165 s) et ne se change
; pas ici.
;
; Jamais servi : les deux .htaccess refusent les fichiers commençant par un
; point (ExposureTest).

upload_max_filesize = 150M
post_max_size = 160M
memory_limit = 3072M
