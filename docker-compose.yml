# Environnement local ET preprod Thor.
#
# Un seul fichier pour les deux : tout ce qui differe vient du `.env` du
# repertoire, que Docker Compose interpole ici et que PHP relit ensuite. Une
# seule source de verite par environnement, et aucun secret dans le depot.
#
# Sans `.env`, les valeurs par defaut ci-dessous donnent un environnement de
# developpement complet : `docker compose up -d` suffit.
#
# Ports repris de 09-environnements §2, verifies libres sur Thor le 2026-07-21
# (18110 et 18111 sont Eneria, 28080 et 28081 sont pris, 18120 est libre).

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cedric_taldu_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18120}:80"
    volumes:
      # Code monte, comme pour ENERIA : un `git pull` deploie, sans
      # reconstruction d'image.
      - ./:/var/www/html:cached
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_URL: ${APP_URL:-http://localhost:18120/cedric-taldu}
      APP_BASE_PATH: ${APP_BASE_PATH:-/cedric-taldu}
      APP_DEFAULT_LOCALE: ${APP_DEFAULT_LOCALE:-fr}
      APP_LOCALES: ${APP_LOCALES:-fr,en}
      # Vide en local, ou aucun proxy n'est devant Apache.
      # Sur Thor : 192.168.1.195, l'adresse de Heimdall.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-cedrictaldu}
      DB_USER: ${DB_USER:-cedrictaldu}
      DB_PASSWORD: ${DB_PASSWORD:-cedrictaldu}
      # Compte dedie aux migrations, distinct de l'applicatif et jamais root
      # (06-securite §1).
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-cedrictaldu_migrate}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-migration}
      DB_TEST_NAME: ${DB_TEST_NAME:-cedrictaldu_test}
      DB_TEST_HOST: db
      DB_TEST_PORT: "3306"
      SECURITY_PEPPER: ${SECURITY_PEPPER:-developpement-uniquement-a-remplacer-hors-local}
      # Paiement et e-mail : injectes ICI (interpolés depuis le `.env` au `up`),
      # comme SECURITY_PEPPER. Le process web tourne en www-data et ne peut pas
      # lire un `.env` en 0600 ; ces secrets doivent donc passer par l'environnement,
      # pas par le fichier. Après modification du `.env` : `docker compose up -d`
      # (un simple `restart` ne réinjecte pas l'environnement).
      STRIPE_ENV: ${STRIPE_ENV:-test}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY:-}
      STRIPE_LIVE_WEBHOOK_SECRET: ${STRIPE_LIVE_WEBHOOK_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-commandes@cedrictaldu.com}
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Cédric Taldu}"
      # Impression à la demande (Prodigi) : mêmes contraintes que Stripe — les
      # secrets passent par l'environnement, pas par le .env (www-data ne le lit pas).
      PRODIGI_ENV: ${PRODIGI_ENV:-sandbox}
      PRODIGI_SANDBOX_API_KEY: ${PRODIGI_SANDBOX_API_KEY:-}
      PRODIGI_LIVE_API_KEY: ${PRODIGI_LIVE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  db:
    image: mysql:8
    container_name: cedric_taldu_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # Jamais expose a Internet : l'hote en local, le LAN sur Thor.
      - "${DB_BIND:-127.0.0.1}:${DB_PORT_HOST:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-racine}
      MYSQL_DATABASE: ${DB_NAME:-cedrictaldu}
      MYSQL_USER: ${DB_USER:-cedrictaldu}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cedrictaldu}
      # Lus par le script d'initialisation, qui cree le compte de migration et
      # restreint le compte applicatif.
      DB_TEST_NAME: ${DB_TEST_NAME:-cedrictaldu_test}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-cedrictaldu_migrate}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-migration}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-racine}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    # 09-environnements §7 : hors production, aucun e-mail ne sort du reseau.
    image: mailhog/mailhog
    container_name: cedric_taldu_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_BIND:-0.0.0.0}:${MAILHOG_PORT:-8027}:8025"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: cedric_taldu_pma
    restart: unless-stopped
    ports:
      - "${PMA_BIND:-127.0.0.1}:${PMA_PORT:-28083}:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
