# Environnement local et preprod Thor.
#
# Ports repris de 09-environnements §2 et verifies libres dans
# HOMELAB/_INFRA_DEVOPS/homelab-desk/docs/infra/port-routing-table.md
# (releve du 2026-07-11) : 18110 est Eneria, 18120 est libre.
#
# Le code est monte, comme pour ENERIA : un `git pull` sur Thor suffit a
# deployer, sans reconstruction d'image.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cedric_taldu_app
    ports:
      - "18120:80"
    volumes:
      - ./:/var/www/html:cached
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_URL: http://localhost:18120/cedric-taldu
      APP_BASE_PATH: /cedric-taldu
      APP_DEFAULT_LOCALE: fr
      APP_LOCALES: fr,en
      # Vide en local : aucun proxy devant Apache. Sur Thor, Heimdall.
      TRUSTED_PROXIES: ""
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: cedrictaldu
      DB_USER: cedrictaldu
      DB_PASSWORD: cedrictaldu
      DB_MIGRATION_USER: root
      DB_MIGRATION_PASSWORD: racine
      DB_TEST_NAME: cedrictaldu_test
      SECURITY_PEPPER: developpement-uniquement-remplacer-en-preprod-et-en-prod
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started

  db:
    image: mysql:8
    container_name: cedric_taldu_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      # LAN uniquement sur Thor ; en local, l'hote seul.
      - "127.0.0.1:13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: racine
      MYSQL_DATABASE: cedrictaldu
      MYSQL_USER: cedrictaldu
      MYSQL_PASSWORD: cedrictaldu
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pracine"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    # 09-environnements §7 : hors production, aucun e-mail ne sort du reseau.
    image: mailhog/mailhog
    container_name: cedric_taldu_mailhog
    ports:
      - "8027:8025"

  phpmyadmin:
    image: phpmyadmin:5
    container_name: cedric_taldu_pma
    ports:
      - "127.0.0.1:28083:80"
    environment:
      PMA_HOST: db
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
