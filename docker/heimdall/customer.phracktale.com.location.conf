# Extrait a reporter dans /etc/nginx/sites-available/customer.phracktale.com.conf
# sur Heimdall (192.168.1.195), a cote du bloc `location /eneria/`.
#
# Meme certificat Let's Encrypt `customer.phracktale.com` (dedie, renouvellement
# automatique par webroot ACME, exp. 2026-10-09). Aucun certificat a emettre.
#
# La pose effective de ce bloc et la reservation des ports dans
# HOMELAB/_INFRA_DEVOPS/homelab-desk/docs/infra/port-routing-table.md
# appartiennent au lot 7. Ce fichier est ici pour que la configuration attendue
# soit versionnee avec le code qui en depend.

location /cedric-taldu/ {
    proxy_pass http://192.168.1.36:18120/;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Sans cette en-tete, l'application ignore qu'elle est servie sous un
    # sous-chemin et produit des URL de production, cassees en preprod.
    # Elle n'est lue que si REMOTE_ADDR figure dans TRUSTED_PROXIES
    # (09-environnements §4) : TRUSTED_PROXIES=192.168.1.195 cote conteneur.
    proxy_set_header X-Forwarded-Prefix /cedric-taldu;

    proxy_read_timeout 60s;

    # Televersement d'images d'œuvres en haute definition : 25 Mo utiles,
    # marge pour l'enrobage multipart.
    client_max_body_size 32m;
}
