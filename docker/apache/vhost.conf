# DocumentRoot sur public/ : c'est la configuration de reference.
# Le .htaccess racine n'existe que pour un mutualise qui ne permettrait pas de
# la changer (09-environnements §5).

ServerSignature Off
ServerTokens Prod

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Ceinture et bretelles : meme si DocumentRoot etait mal positionne, rien
    # de ce qui est hors de public/ n'est servi (06-securite §10).
    <Directory /var/www/html>
        <FilesMatch "^\.env">
            Require all denied
        </FilesMatch>
    </Directory>

    <DirectoryMatch "/var/www/html/(src|tests|migrations|storage|vendor|docker|docs|config|templates|maquette|\.git)">
        Require all denied
    </DirectoryMatch>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
