; Configuration PHP du conteneur.
;
; Les valeurs de securite (display_errors, session.*) sont posees aussi bien ici
; qu'au niveau applicatif : le code ne suppose jamais que le serveur est bien
; configure, et le serveur ne suppose jamais que le code l'est.

; 06-securite §10 — aucune erreur vers le navigateur. Le conteneur sert la
; preprod et doit se comporter comme la production sur ce point.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

expose_php = Off

; 32 Mo : les originaux d'œuvres en haute definition sont limites a 25 Mo
; (06-securite §5.3), avec de la marge pour l'enrobage multipart.
upload_max_filesize = 25M
post_max_size = 32M
max_file_uploads = 20

memory_limit = 256M
max_execution_time = 60

date.timezone = UTC

; 06-securite §4 — reprises par PhpSession::options(), doublees ici.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
