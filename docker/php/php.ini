; Configuration PHP du conteneur.
;
; Les valeurs de securite (display_errors, session.*) sont posees aussi bien ici
; qu'au niveau applicatif : le code ne suppose jamais que le serveur est bien
; configure, et le serveur ne suppose jamais que le code l'est.

; 06-securite §10 — aucune erreur vers le navigateur. Le conteneur sert la
; preprod et doit se comporter comme la production sur ce point.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

expose_php = Off

; 150 Mo : une seule image haute definition par œuvre sert aussi a
; l'impression (demande du 2026-09-30, 06-securite §5.3), marge pour le multipart.
; memory_limit 3072M : ~8,7 octets par pixel au pic (mesuré sur Thor le
; 2026-09-30), pour les 200 Mpx admis par UploadValidator::MAX_PIXELS.
upload_max_filesize = 150M
post_max_size = 160M
max_file_uploads = 20

memory_limit = 3072M
max_execution_time = 180

date.timezone = UTC

; 06-securite §4 — reprises par PhpSession::options(), doublees ici.
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.use_trans_sid = 0

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
